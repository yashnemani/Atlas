<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Human Atlas — 1991: The Reform Story</title>
<style>
  :root {
    --ink: #0d1321;
    --ink-2: #141c30;
    --parchment: #f3ead7;
    --gold: #c9a227;
    --gold-soft: rgba(201,162,39,0.55);
    --text: #e8e2d0;
    --text-dim: rgba(232,226,208,0.62);
    --text-faint: rgba(232,226,208,0.38);
    --card: rgba(20,28,48,0.92);
    --hairline: rgba(232,226,208,0.14);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: var(--ink); color: var(--text); font-family: var(--serif); }

  #stage { position: fixed; inset: 0; cursor: grab; display: block; }
  #stage.dragging { cursor: grabbing; }
  #stage.pointing { cursor: pointer; }

  /* ---------- chrome ---------- */
  #masthead {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    display: flex; align-items: baseline; gap: 18px;
    padding: 22px 34px 14px;
    pointer-events: none;
    background: linear-gradient(to bottom, rgba(13,19,33,0.92), rgba(13,19,33,0));
  }
  #masthead h1 {
    font-size: 21px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--parchment); pointer-events: auto; cursor: pointer; white-space: nowrap;
  }
  #masthead h1 span { color: var(--gold); }
  #crumb { font-family: var(--sans); font-size: 12.5px; letter-spacing: 0.08em; color: var(--text-dim); pointer-events: auto; }
  #crumb b { color: var(--gold); font-weight: 600; }
  #crumb .link { cursor: pointer; text-decoration: none; border-bottom: 1px dotted var(--text-faint); }
  #crumb .link:hover { color: var(--parchment); }

  #hint {
    position: fixed; bottom: 22px; left: 0; right: 0; z-index: 25; text-align: center;
    font-family: var(--sans); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--text-faint); pointer-events: none; transition: opacity 0.6s;
  }

  #era-badge {
    position: fixed; top: 24px; right: 34px; z-index: 30; text-align: right; pointer-events: none;
  }
  #era-badge .era-years { font-size: 26px; color: var(--gold); letter-spacing: 0.06em; font-style: italic; }
  #era-badge .era-sub { font-family: var(--sans); font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-faint); margin-top: 2px; }

  /* topic-view action bar */
  #topic-actions {
    position: fixed; bottom: 56px; left: 0; right: 0; z-index: 26;
    display: none; justify-content: center; gap: 14px;
  }
  .btn {
    font-family: var(--sans); font-size: 12.5px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--parchment); background: rgba(20,28,48,0.85); border: 1px solid var(--hairline);
    padding: 11px 22px; border-radius: 999px; cursor: pointer; transition: all 0.25s; backdrop-filter: blur(6px);
  }
  .btn:hover { border-color: var(--gold-soft); color: var(--gold); transform: translateY(-1px); }
  .btn.primary { background: var(--gold); color: var(--ink); border-color: var(--gold); font-weight: 600; }
  .btn.primary:hover { background: #dcb52f; color: var(--ink); }

  /* ---------- hover tooltip ---------- */
  #tip {
    position: fixed; z-index: 40; pointer-events: none; opacity: 0; transition: opacity 0.15s;
    background: var(--card); border: 1px solid var(--hairline); border-radius: 10px;
    padding: 10px 14px; max-width: 280px; backdrop-filter: blur(8px);
    box-shadow: 0 14px 40px rgba(0,0,0,0.5);
  }
  #tip .t-title { font-size: 15px; color: var(--parchment); }
  #tip .t-sub { font-family: var(--sans); font-size: 11px; letter-spacing: 0.06em; color: var(--text-dim); margin-top: 3px; }

  /* ---------- panels (person / event) ---------- */
  .panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 94vw); z-index: 50;
    background: linear-gradient(160deg, #131a2e 0%, #0e1424 100%);
    border-left: 1px solid var(--hairline);
    box-shadow: -30px 0 80px rgba(0,0,0,0.55);
    transform: translateX(105%); transition: transform 0.45s cubic-bezier(0.22,1,0.36,1);
    overflow-y: auto; overscroll-behavior: contain;
  }
  .panel.open { transform: translateX(0); }
  .panel::-webkit-scrollbar { width: 6px; }
  .panel::-webkit-scrollbar-thumb { background: rgba(232,226,208,0.18); border-radius: 3px; }

  .panel-close {
    position: sticky; top: 0; z-index: 5; display: flex; justify-content: space-between; align-items: center;
    padding: 16px 26px; background: linear-gradient(to bottom, rgba(14,20,36,0.97), rgba(14,20,36,0.85));
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--hairline);
  }
  .panel-close .x {
    cursor: pointer; font-family: var(--sans); font-size: 12px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--text-dim); border: 1px solid var(--hairline);
    border-radius: 999px; padding: 7px 16px; transition: all 0.2s; background: none;
  }
  .panel-close .x:hover { color: var(--gold); border-color: var(--gold-soft); }
  .panel-kicker { font-family: var(--sans); font-size: 10.5px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--gold); }

  .panel-body { padding: 30px 34px 70px; }

  /* person view */
  .person-head { display: flex; gap: 20px; align-items: center; margin-bottom: 8px; }
  .avatar {
    width: 74px; height: 74px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; color: var(--ink); font-weight: 600; font-family: var(--sans);
    border: 2px solid rgba(232,226,208,0.35); box-shadow: 0 6px 24px rgba(0,0,0,0.4);
  }
  .person-head h2 { font-size: 30px; font-weight: 600; color: var(--parchment); line-height: 1.1; }
  .person-head .role { font-family: var(--sans); font-size: 12.5px; color: var(--text-dim); margin-top: 5px; letter-spacing: 0.04em; }
  .person-bio { font-size: 15.5px; line-height: 1.65; color: var(--text-dim); margin: 18px 0 10px; font-style: italic; }

  .tl-context {
    font-family: var(--sans); font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-faint); margin: 26px 0 6px; display: flex; align-items: center; gap: 10px;
  }
  .tl-context::after { content: ""; flex: 1; height: 1px; background: var(--hairline); }

  /* timeline */
  .timeline { position: relative; margin-top: 8px; padding-left: 28px; }
  .timeline::before { content: ""; position: absolute; left: 7px; top: 8px; bottom: 8px; width: 1px; background: linear-gradient(to bottom, var(--gold-soft), rgba(201,162,39,0.08)); }
  .tl-year { position: relative; font-size: 34px; font-style: italic; color: var(--gold); margin: 30px 0 14px; }
  .tl-year:first-child { margin-top: 14px; }
  .tl-year::before { content: ""; position: absolute; left: -26px; top: 50%; width: 11px; height: 11px; border-radius: 50%; background: var(--gold); transform: translateY(-50%); box-shadow: 0 0 0 4px rgba(201,162,39,0.18); }

  .story-card {
    position: relative; background: var(--card); border: 1px solid var(--hairline); border-radius: 14px;
    padding: 20px 22px; margin-bottom: 16px; cursor: pointer; transition: all 0.25s;
  }
  .story-card::before { content: ""; position: absolute; left: -25px; top: 28px; width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); }
  .story-card:hover { border-color: var(--gold-soft); transform: translateX(4px); }
  .story-card .sc-date { font-family: var(--sans); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
  .story-card h3 { font-size: 19px; font-weight: 600; color: var(--parchment); line-height: 1.25; }
  .story-card .sc-sum { font-size: 14.5px; line-height: 1.6; color: var(--text-dim); margin-top: 8px; }
  .story-card .sc-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 13px; }

  .chip {
    font-family: var(--sans); font-size: 11px; letter-spacing: 0.04em; padding: 4px 11px;
    border-radius: 999px; border: 1px solid var(--hairline); color: var(--text-dim);
    cursor: pointer; transition: all 0.2s; background: rgba(232,226,208,0.04);
  }
  .chip:hover { color: var(--parchment); border-color: var(--gold-soft); }
  .chip.topic-chip { border-style: solid; }
  .chip .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }

  /* event view */
  .ev-date { font-family: var(--sans); font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); margin-bottom: 12px; }
  .ev-title { font-size: 34px; line-height: 1.13; font-weight: 600; color: var(--parchment); margin-bottom: 18px; }
  .ev-summary { font-size: 17px; line-height: 1.7; color: var(--text); }
  .ev-summary::first-letter { font-size: 290%; float: left; line-height: 0.82; padding: 6px 10px 0 0; color: var(--gold); font-style: italic; }
  .ev-section { margin-top: 30px; }
  .ev-section h4 { font-family: var(--sans); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
  .ev-section h4::after { content: ""; flex: 1; height: 1px; background: var(--hairline); }

  .people-row { display: flex; flex-wrap: wrap; gap: 12px; }
  .person-pill {
    display: flex; align-items: center; gap: 10px; padding: 7px 16px 7px 8px;
    background: rgba(232,226,208,0.05); border: 1px solid var(--hairline); border-radius: 999px;
    cursor: pointer; transition: all 0.2s;
  }
  .person-pill:hover { border-color: var(--gold-soft); background: rgba(201,162,39,0.08); }
  .person-pill .avatar { width: 32px; height: 32px; font-size: 12.5px; border-width: 1px; box-shadow: none; }
  .person-pill .pp-name { font-size: 14px; color: var(--parchment); }
  .person-pill .pp-role { font-family: var(--sans); font-size: 10.5px; color: var(--text-faint); display: block; }

  .conn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .conn-col h5 { font-size: 13px; font-style: italic; color: var(--gold); margin-bottom: 10px; font-weight: 500; }
  .conn-card {
    background: rgba(232,226,208,0.04); border: 1px solid var(--hairline); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s;
  }
  .conn-card:hover { border-color: var(--gold-soft); }
  .conn-card .cc-date { font-family: var(--sans); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-faint); }
  .conn-card .cc-title { font-size: 14px; color: var(--parchment); margin-top: 3px; line-height: 1.3; }
  .conn-empty { font-size: 13px; font-style: italic; color: var(--text-faint); padding: 8px 2px; }

  .doc-link {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px; margin-bottom: 8px;
    border: 1px dashed var(--hairline); border-radius: 10px; font-family: var(--sans);
    font-size: 13px; color: var(--text-dim); cursor: pointer; transition: all 0.2s;
  }
  .doc-link:hover { color: var(--gold); border-color: var(--gold-soft); }
  .doc-link .ico { font-size: 15px; }

  /* ---------- story mode ---------- */
  #story {
    position: fixed; inset: 0; z-index: 80; background: radial-gradient(ellipse at 50% 30%, #1a2340 0%, #0a0f1d 75%);
    display: none; flex-direction: column;
  }
  #story.open { display: flex; }
  #story-top { display: flex; justify-content: space-between; align-items: center; padding: 26px 40px 0; }
  #story-kicker { font-family: var(--sans); font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--gold); }
  #story-exit { cursor: pointer; font-family: var(--sans); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-dim); border: 1px solid var(--hairline); border-radius: 999px; padding: 8px 18px; background: none; transition: all 0.2s; }
  #story-exit:hover { color: var(--gold); border-color: var(--gold-soft); }

  #story-stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px 7vw; position: relative; }
  .story-slide { max-width: 760px; text-align: center; animation: slideIn 0.7s cubic-bezier(0.22,1,0.36,1); }
  @keyframes slideIn { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
  .ss-act { font-family: var(--sans); font-size: 11.5px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--gold); margin-bottom: 22px; }
  .ss-date { font-size: 19px; font-style: italic; color: var(--text-dim); margin-bottom: 14px; }
  .ss-title { font-size: clamp(30px, 4.6vw, 52px); line-height: 1.12; font-weight: 600; color: var(--parchment); margin-bottom: 26px; }
  .ss-body { font-size: clamp(16px, 1.5vw, 19.5px); line-height: 1.75; color: var(--text-dim); }
  .ss-people { display: flex; justify-content: center; gap: 14px; margin-top: 34px; flex-wrap: wrap; }
  .ss-people .avatar { width: 52px; height: 52px; font-size: 18px; }
  .ss-people .sp { text-align: center; width: 86px; }
  .ss-people .sp .spn { font-family: var(--sans); font-size: 10.5px; color: var(--text-faint); margin-top: 7px; line-height: 1.3; }

  #story-nav { display: flex; align-items: center; gap: 22px; justify-content: center; padding: 0 40px 34px; }
  .snav-btn { cursor: pointer; background: none; border: 1px solid var(--hairline); color: var(--text-dim); width: 46px; height: 46px; border-radius: 50%; font-size: 17px; transition: all 0.2s; }
  .snav-btn:hover:not(:disabled) { color: var(--gold); border-color: var(--gold-soft); }
  .snav-btn:disabled { opacity: 0.25; cursor: default; }
  #story-progress { display: flex; gap: 7px; }
  #story-progress .pip { width: 26px; height: 3px; border-radius: 2px; background: rgba(232,226,208,0.15); cursor: pointer; transition: background 0.3s; }
  #story-progress .pip.done { background: var(--gold-soft); }
  #story-progress .pip.now { background: var(--gold); }

  #veil { position: fixed; inset: 0; z-index: 45; background: rgba(8,12,22,0.45); opacity: 0; pointer-events: none; transition: opacity 0.4s; }
  #veil.on { opacity: 1; pointer-events: auto; }

  @media (max-width: 720px) {
    #masthead { padding: 16px 18px 10px; flex-wrap: wrap; gap: 8px; }
    #era-badge { display: none; }
    .panel-body { padding: 24px 20px 60px; }
    .conn-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<canvas id="stage"></canvas>

<header id="masthead">
  <h1 onclick="goAtlas()">Human <span>Atlas</span></h1>
  <div id="crumb"></div>
</header>

<div id="era-badge">
  <div class="era-years">1990 – 1993</div>
  <div class="era-sub">India's Reform Moment</div>
</div>

<div id="hint">Drift across the landscape · scroll to zoom · choose an island to enter its story</div>

<div id="topic-actions">
  <button class="btn" onclick="goAtlas()">← Back to Atlas</button>
  <button class="btn primary" id="play-story-btn">▶ &nbsp;Play Story</button>
</div>

<div id="tip"><div class="t-title"></div><div class="t-sub"></div></div>

<div id="veil" onclick="closePanels()"></div>

<aside class="panel" id="person-panel">
  <div class="panel-close">
    <span class="panel-kicker">Biography · Timeline</span>
    <button class="x" onclick="closePanels()">Close ✕</button>
  </div>
  <div class="panel-body" id="person-body"></div>
</aside>

<aside class="panel" id="event-panel">
  <div class="panel-close">
    <span class="panel-kicker">Moment in Time</span>
    <button class="x" onclick="closePanels()">Close ✕</button>
  </div>
  <div class="panel-body" id="event-body"></div>
</aside>

<div id="story">
  <div id="story-top">
    <span id="story-kicker"></span>
    <button id="story-exit" onclick="exitStory()">Exit Story ✕</button>
  </div>
  <div id="story-stage"></div>
  <div id="story-nav">
    <button class="snav-btn" id="snav-prev" onclick="storyStep(-1)">←</button>
    <div id="story-progress"></div>
    <button class="snav-btn" id="snav-next" onclick="storyStep(1)">→</button>
  </div>
</div>

<script>
/* =====================================================================
   DATA — the 1991 Indian economic reform story
   ===================================================================== */

const PEOPLE = [
  { id:"rao",     name:"P. V. Narasimha Rao", role:"Prime Minister, 1991–96", bio:"A scholar-politician on the verge of retirement when fate handed him the prime ministership. He gave his reformers political cover and absorbed the heat — reform by stealth, conviction held quietly." },
  { id:"singh",   name:"Manmohan Singh", role:"Finance Minister, 1991–96", bio:"The soft-spoken economist who told Parliament that no power on earth could stop an idea whose time had come. He turned a balance-of-payments emergency into a generational turning point." },
  { id:"rangarajan", name:"C. Rangarajan", role:"Deputy Governor, RBI", bio:"The central banker who executed the two-step devaluation. When Delhi wavered before the second step, he answered the Prime Minister's office with three words: 'I have jumped.'" },
  { id:"venkitaramanan", name:"S. Venkitaramanan", role:"Governor, RBI", bio:"Steered the Reserve Bank through the darkest weeks of the crisis — including the decision to pledge the nation's gold abroad to avoid default." },
  { id:"montek",  name:"Montek Singh Ahluwalia", role:"Commerce Secretary", bio:"Author of the secret 'M Document' that sketched the whole reform blueprint a year before the crisis broke. The intellectual quartermaster of 1991." },
  { id:"chidambaram", name:"P. Chidambaram", role:"Commerce Minister", bio:"Announced the trade reforms within days of the new government taking office — dismantling export subsidies and import licensing in one stroke." },
  { id:"anverma", name:"A. N. Verma", role:"Principal Secretary to the PM", bio:"The quiet enforcer inside the PMO who drove the new industrial policy through a sceptical bureaucracy in barely four weeks." },
  { id:"rakesh",  name:"Rakesh Mohan", role:"Economic Adviser, Industry Ministry", bio:"Drafted the New Industrial Policy that abolished licensing — a document he had been refining, unloved, for years before its moment arrived." },
  { id:"sinha",   name:"Yashwant Sinha", role:"Finance Minister, 1990–91", bio:"Finance minister of the short-lived Chandra Shekhar government. Prepared a reformist budget he never got to present — and authorised the first gold pledge." },
  { id:"chandrashekhar", name:"Chandra Shekhar", role:"Prime Minister, 1990–91", bio:"Led a minority government through the worst months of the crisis. His government took the politically radioactive decision to ship gold abroad." },
  { id:"jairam",  name:"Jairam Ramesh", role:"Aide, Prime Minister's Office", bio:"The young aide who carried drafts between the PMO and North Block in the frantic weeks of June–July 1991, helping shape the budget speech's famous closing lines." },
  { id:"igpatel", name:"I. G. Patel", role:"Economist; former RBI Governor", bio:"Rao's first choice for finance minister. He declined — and suggested the job go to a quiet Sikh economist then chairing the UGC." },
];

const TOPICS = [
  { id:"bop",       name:"Balance of Payments", color:"#e3a93c", description:"India's foreign reserves collapsed to barely two weeks of imports. The story of how a proud nation came within days of default — and the desperate measures that bought it time." },
  { id:"politics",  name:"Politics of Reform", color:"#d4604f", description:"Reform was never just economics. Governments fell, a leader was assassinated, and an accidental Prime Minister found the will to change course — by stealth where necessary." },
  { id:"rupee",     name:"The Rupee", color:"#4fb8a8", description:"Two devaluations in three days — the 'hop, skip and jump' — began the rupee's long walk from a fixed administered rate to market-determined convertibility." },
  { id:"trade",     name:"Trade Policy", color:"#5d8fd4", description:"From export subsidies and import licences to Eximscrips and open general licensing: the dismantling of four decades of trade control, announced within days of the new government." },
  { id:"industry",  name:"Licence Raj", color:"#9a6fd0", description:"For forty years, an Indian entrepreneur needed the state's permission to produce. On a single July day in 1991, most of that machinery was switched off." },
  { id:"budget",    name:"The Budget", color:"#6cab5f", description:"The Union Budget of 24 July 1991 — fiscal correction, a new exchange-rate philosophy, and a closing line borrowed from Victor Hugo that became the epigraph of a new India." },
  { id:"imf",       name:"IMF & the World", color:"#d08a4e", description:"Negotiating with the IMF while gold flew to London: how India used conditionality as cover, took the money, and then outran the programme." },
];

const EVENTS = [
  { id:"e1", title:"The 'M Document' circulates", date:"1990-06-15", display:"June 1990",
    summary:"A year before the crisis broke, Montek Singh Ahluwalia quietly circulated an unsigned paper in V. P. Singh's PMO proposing sweeping liberalisation — industrial delicensing, trade reform, exchange-rate change. Leaked to the press, it was denounced and shelved. But the blueprint now existed, waiting for its moment.",
    people:["montek"], topics:["politics","industry","trade"],
    docs:["'Towards a Restructuring of Industrial, Trade and Fiscal Policies' (the M Document)"] },

  { id:"e2", title:"Gulf War oil shock hits the reserves", date:"1990-08-02", display:"August 1990",
    summary:"Iraq invaded Kuwait and oil prices doubled. India's import bill ballooned just as remittances from Gulf workers collapsed and 100,000 Indians had to be airlifted home. The slow leak in the balance of payments became a rupture.",
    people:["venkitaramanan","sinha"], topics:["bop"],
    docs:["RBI Annual Report 1990–91, external sector review"] },

  { id:"e3", title:"Chandra Shekhar's government falls", date:"1991-03-06", display:"6 March 1991",
    summary:"Congress withdrew support over a trivial pretext, and the minority government collapsed before Yashwant Sinha could present his budget — a budget that, by his own account, contained much of the reform programme. India went to elections with an empty treasury and a caretaker government.",
    people:["chandrashekhar","sinha"], topics:["politics","budget"],
    docs:["Yashwant Sinha, 'Confessions of a Swadeshi Reformer' (memoir)"] },

  { id:"e4", title:"The first gold pledge", date:"1991-05-16", display:"May 1991",
    summary:"With reserves below $1 billion, the caretaker government authorised the State Bank of India to lease 20 tonnes of confiscated gold to UBS in Switzerland, raising $200 million. The decision was so sensitive it was kept from the public in the middle of an election campaign.",
    people:["chandrashekhar","sinha","venkitaramanan"], topics:["bop","politics"],
    docs:["SBI–UBS gold lease arrangement, May 1991"] },

  { id:"e5", title:"Rajiv Gandhi assassinated", date:"1991-05-21", display:"21 May 1991",
    summary:"Midway through the election, Rajiv Gandhi was assassinated at Sriperumbudur. The tragedy reshaped the election, returned Congress as the largest party, and put the leadership question to a man who had already packed his books for retirement: P. V. Narasimha Rao.",
    people:["rao"], topics:["politics"],

  { id:"e6", title:"Narasimha Rao sworn in as Prime Minister", date:"1991-06-21", display:"21 June 1991",

/* =====================================================================
   DERIVED INDICES
   ===================================================================== */
const personById = Object.fromEntries(PEOPLE.map(p=>[p.id,p]));
const topicById  = Object.fromEntries(TOPICS.map(t=>[t.id,t]));
const eventById  = Object.fromEntries(EVENTS.map(e=>[e.id,e]));
EVENTS.sort((a,b)=> a.date.localeCompare(b.date));

const topicEvents = {};   // topicId -> events sorted by date
TOPICS.forEach(t => topicEvents[t.id] = EVENTS.filter(e=>e.topics.includes(t.id)));
const personEvents = {};  // personId -> events
PEOPLE.forEach(p => personEvents[p.id] = EVENTS.filter(e=>e.people.includes(p.id)));

// topic-topic shared event weights
const topicLinks = [];
for (let i=0;i<TOPICS.length;i++) for (let j=i+1;j<TOPICS.length;j++) {
  const shared = EVENTS.filter(e=>e.topics.includes(TOPICS[i].id)&&e.topics.includes(TOPICS[j].id)).length;
  if (shared>0) topicLinks.push({a:TOPICS[i].id, b:TOPICS[j].id, w:shared});
}
// person involvement per topic
function topicPeople(tid){
  const counts = {};
  topicEvents[tid].forEach(e=>e.people.forEach(p=>counts[p]=(counts[p]||0)+1));
  return Object.entries(counts).map(([pid,c])=>({person:personById[pid], count:c}))
    .sort((a,b)=>b.count-a.count);
}

function initials(name){
  const parts = name.replace(/\./g,'').split(/\s+/).filter(w=>w.length>0);
  if (parts.length===1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0]+parts[parts.length-1][0]).toUpperCase();
}
function personHue(p){ let h=0; for(const ch of p.id) h=(h*31+ch.charCodeAt(0))%360; return h; }
function avatarStyle(p){ const h=personHue(p); return `background: linear-gradient(135deg, hsl(${h},42%,72%), hsl(${(h+40)%360},48%,52%))`; }
function fmtDate(e){ return e.display; }
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

/* =====================================================================
   CANVAS — physics landscape (atlas + topic constellation)
   ===================================================================== */
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
let W=0, H=0, DPR=Math.min(2, window.devicePixelRatio||1);
function resize(){ W=innerWidth; H=innerHeight; canvas.width=W*DPR; canvas.height=H*DPR; canvas.style.width=W+'px'; canvas.style.height=H+'px'; }
addEventListener('resize', resize); resize();

const cam = { x:0, y:0, z:1, tx:0, ty:0, tz:1 };
let mode = 'atlas';          // 'atlas' | 'topic'
let currentTopic = null;
let nodes = [];              // active physics nodes
let links = [];              // active links
let hoverNode = null;
let dragNode = null, panning=false, lastMx=0, lastMy=0, downX=0, downY=0, moved=false;
let t0 = performance.now();

// background starfield (fixed in world space)
const stars = Array.from({length:170}, (_,i)=>({
  x:(Math.sin(i*127.1)*43758.5453)%1*2400-1200,
  y:(Math.sin(i*311.7)*12543.987)%1*1600-800,
  r:0.5+Math.abs(Math.sin(i*7.3))*1.3,
  ph:i*0.7
}));

function makeAtlasNodes(){
  mode='atlas'; currentTopic=null;
  const maxEv = Math.max(...TOPICS.map(t=>topicEvents[t.id].length));
  nodes = TOPICS.map((t,i)=>{
    const ang = (i/TOPICS.length)*Math.PI*2 - Math.PI/2;
    const evn = topicEvents[t.id].length;
    const ppl = topicPeople(t.id).length;
    const significance = evn + ppl*0.5;
    const R = 46 + 64*(evn/maxEv);
    return {
      kind:'topic', ref:t, id:t.id,
      x: Math.cos(ang)*300 + (Math.sin(i*99)*40), y: Math.sin(ang)*210 + (Math.cos(i*57)*30),
      vx:0, vy:0, r:R, baseR:R, phase:i*1.37, sig:significance
    };
  });
  links = topicLinks.map(l=>({a:nodes.find(n=>n.id===l.a), b:nodes.find(n=>n.id===l.b), w:l.w, kind:'tt'}));
  cam.tx=0; cam.ty=0; cam.tz=1;
  document.getElementById('topic-actions').style.display='none';
  setCrumb('');
  setHint('Drift across the landscape · scroll to zoom · choose an island to enter its story');
}

function makeTopicNodes(tid){
  mode='topic'; currentTopic = topicById[tid];
  const ppl = topicPeople(tid);
  const maxC = Math.max(...ppl.map(p=>p.count));
  const center = { kind:'topicCenter', ref:currentTopic, id:tid, x:0, y:0, vx:0, vy:0, r:92, phase:0, fixed:true };
  const orbiters = ppl.map((pc,i)=>{
    const ang = (i/ppl.length)*Math.PI*2 - Math.PI/2 + 0.35;
    const ringR = 185 + (maxC - pc.count) * 62;   // closer = more involved
    return {
      kind:'person', ref:pc.person, id:pc.person.id, count:pc.count,
      x: Math.cos(ang)*ringR, y: Math.sin(ang)*ringR,
      vx:0, vy:0, r: 30 + pc.count*4.5, phase:i*0.9,
      anchorAngle: ang, anchorR: ringR
    };
  });
  nodes = [center, ...orbiters];
  links = orbiters.map(o=>({a:center, b:o, w:o.count, kind:'tp'}));
  cam.tx=0; cam.ty=0; cam.tz=1;
  document.getElementById('topic-actions').style.display='flex';
  document.getElementById('play-story-btn').onclick = ()=>openStory(tid);
  setCrumb(`<span class="link" onclick="goAtlas()">Atlas</span> &nbsp;→&nbsp; <b>${currentTopic.name}</b>`);
  setHint('The closer a person floats, the deeper their part in this story · click a portrait to read their timeline');
}

function setCrumb(html){ document.getElementById('crumb').innerHTML = html; }
function setHint(s){ const h=document.getElementById('hint'); h.style.opacity=0; setTimeout(()=>{h.textContent=s; h.style.opacity=1;},350); }

function goAtlas(){ closePanels(); exitStory(); makeAtlasNodes(); }
window.goAtlas = goAtlas;

/* ---------- physics ---------- */
function physics(dt, time){
  const T = time*0.001;
  for (const n of nodes){
    if (n.fixed){ n.x*=0.85; n.y*=0.85; continue; }
    // gentle organic wander
    n.vx += Math.sin(T*0.55 + n.phase*3.1) * 1.1 * dt;
    n.vy += Math.cos(T*0.43 + n.phase*2.3) * 1.1 * dt;

    if (mode==='atlas'){
      // weak gravity to centre
      n.vx += -n.x * 0.12 * dt;
      n.vy += -n.y * 0.14 * dt;
    } else {
      // spring to orbital anchor
      const ax = Math.cos(n.anchorAngle)*n.anchorR, ay = Math.sin(n.anchorAngle)*n.anchorR;
      n.vx += (ax-n.x) * 1.7 * dt;
      n.vy += (ay-n.y) * 1.7 * dt;
      n.anchorAngle += dt*0.011*(n.phase%2?1:-1);  // slow orbital drift
    }
  }
  // pairwise repulsion / collision
  for (let i=0;i<nodes.length;i++) for (let j=i+1;j<nodes.length;j++){
    const a=nodes[i], b=nodes[j];
    let dx=b.x-a.x, dy=b.y-a.y;
    let d=Math.hypot(dx,dy)||0.01;
    const minD=a.r+b.r+26;
    if (d<minD){
      const f=(minD-d)/d * 2.6 * dt;
      const fx=dx*f, fy=dy*f;
      if(!a.fixed){a.vx-=fx; a.vy-=fy;}
      if(!b.fixed){b.vx+=fx; b.vy+=fy;}
    } else {
      const f = 5200/(d*d) * dt;
      const fx=dx/d*f, fy=dy/d*f;
      if(!a.fixed){a.vx-=fx; a.vy-=fy;}
      if(!b.fixed){b.vx+=fx; b.vy+=fy;}
    }
  }
  // link springs (atlas only — topic links handled by anchors)
  if (mode==='atlas') for (const l of links){
    const dx=l.b.x-l.a.x, dy=l.b.y-l.a.y, d=Math.hypot(dx,dy)||0.01;
    const rest = l.a.r + l.b.r + 150 - l.w*16;
    const f = (d-rest)/d * 0.5 * dt;
    l.a.vx += dx*f; l.a.vy += dy*f;
    l.b.vx -= dx*f; l.b.vy -= dy*f;
  }
  for (const n of nodes){
    if (n===dragNode || n.fixed) { n.vx=0; n.vy=0; continue; }
    n.vx *= Math.pow(0.18, dt); n.vy *= Math.pow(0.18, dt);
    n.x += n.vx*dt*60*0.016; n.y += n.vy*dt*60*0.016;
    n.x += n.vx; n.y += n.vy;
  }
}

/* ---------- drawing ---------- */
function worldToScreen(x,y){ return [ (x-cam.x)*cam.z + W/2, (y-cam.y)*cam.z + H/2 ]; }
function screenToWorld(sx,sy){ return [ (sx-W/2)/cam.z + cam.x, (sy-H/2)/cam.z + cam.y ]; }

function hexA(hex, a){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function draw(time){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // backdrop
  const bg = ctx.createRadialGradient(W/2,H*0.38,80, W/2,H/2, Math.max(W,H)*0.85);
  bg.addColorStop(0,'#16203a'); bg.addColorStop(1,'#0a0f1d');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  const T=time*0.001;
  // stars
  for (const s of stars){
    const [sx,sy]=worldToScreen(s.x*0.55 + cam.x*0.45, s.y*0.55 + cam.y*0.45);
    if(sx<-10||sx>W+10||sy<-10||sy>H+10) continue;
    const tw = 0.25+0.45*Math.abs(Math.sin(T*0.7+s.ph));
    ctx.fillStyle=`rgba(232,226,208,${tw*0.4})`;
    ctx.beginPath(); ctx.arc(sx,sy,s.r,0,7); ctx.fill();
  }

  // links
  for (const l of links){
    const [ax,ay]=worldToScreen(l.a.x,l.a.y), [bx,by]=worldToScreen(l.b.x,l.b.y);
    const hot = hoverNode && (hoverNode===l.a||hoverNode===l.b);
    const baseAlpha = l.kind==='tt' ? 0.05+l.w*0.035 : 0.10+l.w*0.04;
    ctx.strokeStyle = hot ? 'rgba(201,162,39,0.55)' : `rgba(232,226,208,${baseAlpha})`;
    ctx.lineWidth = (hot?1.6:1)*(0.6+l.w*0.35)*cam.z;
    const mx=(ax+bx)/2, my=(ay+by)/2 + Math.sin(T*0.8+l.w)*8*cam.z;
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.quadraticCurveTo(mx,my,bx,by); ctx.stroke();
    // travelling spark on hot links
    if (hot){
      const p=(T*0.35+l.w*0.17)%1;
      const qx=(1-p)*(1-p)*ax+2*(1-p)*p*mx+p*p*bx, qy=(1-p)*(1-p)*ay+2*(1-p)*p*my+p*p*by;
      ctx.fillStyle='rgba(201,162,39,0.9)';
      ctx.beginPath(); ctx.arc(qx,qy,2.4*cam.z,0,7); ctx.fill();
    }
  }

  // nodes
  for (const n of nodes){
    const [sx,sy]=worldToScreen(n.x,n.y);
    const breathe = 1 + 0.025*Math.sin(T*1.1+n.phase*4);
    const r = n.r * cam.z * breathe * (n===hoverNode?1.07:1);

    if (n.kind==='topic' || n.kind==='topicCenter'){
      const c = n.ref.color;
      // halo
      const halo = ctx.createRadialGradient(sx,sy,r*0.4, sx,sy,r*2.1);
      halo.addColorStop(0, hexA(c, n===hoverNode?0.34:0.22));
      halo.addColorStop(1, hexA(c,0));
      ctx.fillStyle=halo; ctx.beginPath(); ctx.arc(sx,sy,r*2.1,0,7); ctx.fill();
      // body
      const body = ctx.createRadialGradient(sx-r*0.3,sy-r*0.35,r*0.15, sx,sy,r);
      body.addColorStop(0, hexA(c,0.95));
      body.addColorStop(1, hexA(c,0.55));
      ctx.fillStyle=body; ctx.beginPath(); ctx.arc(sx,sy,r,0,7); ctx.fill();
      ctx.strokeStyle = n===hoverNode ? 'rgba(243,234,215,0.95)' : 'rgba(243,234,215,0.4)';
      ctx.lineWidth = 1.6*cam.z;
      ctx.beginPath(); ctx.arc(sx,sy,r,0,7); ctx.stroke();
      // inner ring detail
      ctx.strokeStyle='rgba(13,19,33,0.25)'; ctx.lineWidth=1*cam.z;
      ctx.beginPath(); ctx.arc(sx,sy,r*0.82,0,7); ctx.stroke();
      // label
      ctx.fillStyle='#0d1321';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      const fs = Math.max(10, Math.min(r*0.24, 20*cam.z));
      ctx.font=`600 ${fs}px ${'"Avenir Next","Helvetica Neue",Arial,sans-serif'}`;
      wrapText(n.ref.name, sx, sy - fs*0.25, r*1.5, fs*1.12);
      ctx.font=`${Math.max(8,fs*0.62)}px "Avenir Next","Helvetica Neue",Arial,sans-serif`;
      ctx.fillStyle='rgba(13,19,33,0.72)';
      const evn=topicEvents[n.id].length;
      ctx.fillText(`${evn} moments`, sx, sy + (n.ref.name.length>14? fs*1.25: fs*0.85));
    }

    if (n.kind==='person'){
      const p=n.ref, h=personHue(p);
      // halo
      const halo = ctx.createRadialGradient(sx,sy,r*0.5, sx,sy,r*1.9);
      halo.addColorStop(0, `hsla(${h},45%,65%,${n===hoverNode?0.3:0.16})`);
      halo.addColorStop(1, `hsla(${h},45%,65%,0)`);
      ctx.fillStyle=halo; ctx.beginPath(); ctx.arc(sx,sy,r*1.9,0,7); ctx.fill();
      // portrait disc
      const body=ctx.createLinearGradient(sx-r,sy-r,sx+r,sy+r);
      body.addColorStop(0,`hsl(${h},42%,74%)`); body.addColorStop(1,`hsl(${(h+40)%360},48%,50%)`);
      ctx.fillStyle=body; ctx.beginPath(); ctx.arc(sx,sy,r,0,7); ctx.fill();
      ctx.strokeStyle= n===hoverNode ? '#f3ead7' : 'rgba(243,234,215,0.55)';
      ctx.lineWidth=(n===hoverNode?2.2:1.4)*cam.z;
      ctx.beginPath(); ctx.arc(sx,sy,r,0,7); ctx.stroke();
      // initials
      ctx.fillStyle='rgba(13,19,33,0.85)';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.font=`600 ${r*0.62}px "Avenir Next","Helvetica Neue",Arial,sans-serif`;
      ctx.fillText(initials(p.name), sx, sy+1);
      // name caption
      ctx.font=`${Math.max(9,12.5*cam.z)}px "Avenir Next","Helvetica Neue",Arial,sans-serif`;
      ctx.fillStyle = n===hoverNode ? '#f3ead7' : 'rgba(232,226,208,0.78)';
      ctx.fillText(p.name, sx, sy + r + 16*cam.z);
      ctx.font=`italic ${Math.max(8,10.5*cam.z)}px Georgia,serif`;
      ctx.fillStyle='rgba(201,162,39,0.85)';
      ctx.fillText(`${n.count} moment${n.count>1?'s':''} together`, sx, sy + r + 31*cam.z);
    }
  }
}

function wrapText(text, x, y, maxW, lh){
  const words=text.split(' '); let line='', lines=[];
  for (const w of words){
    const test=line? line+' '+w : w;
    if (ctx.measureText(test).width>maxW && line){ lines.push(line); line=w; } else line=test;
  }
  lines.push(line);
  const oy = y - (lines.length-1)*lh/2;
  lines.forEach((l,i)=>ctx.fillText(l, x, oy+i*lh));
}

/* ---------- main loop ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  cam.x += (cam.tx-cam.x)*0.09; cam.y += (cam.ty-cam.y)*0.09; cam.z += (cam.tz-cam.z)*0.09;
  physics(dt, now);
  draw(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- interaction ---------- */
function nodeAt(sx,sy){
  const [wx,wy]=screenToWorld(sx,sy);
  for (let i=nodes.length-1;i>=0;i--){
    const n=nodes[i];
    if (Math.hypot(wx-n.x, wy-n.y) < n.r+8) return n;
  }
  return null;
}
const tip=document.getElementById('tip');

canvas.addEventListener('pointerdown', e=>{
  downX=e.clientX; downY=e.clientY; moved=false;
  const n=nodeAt(e.clientX,e.clientY);
  if (n && !n.fixed){ dragNode=n; }
  else { panning=true; canvas.classList.add('dragging'); }
  lastMx=e.clientX; lastMy=e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e=>{
  const dx=e.clientX-lastMx, dy=e.clientY-lastMy;
  if (Math.hypot(e.clientX-downX, e.clientY-downY)>5) moved=true;
  if (dragNode){
    dragNode.x += dx/cam.z; dragNode.y += dy/cam.z;
    if (dragNode.anchorR!==undefined){
      dragNode.anchorAngle=Math.atan2(dragNode.y,dragNode.x);
      dragNode.anchorR=Math.max(150, Math.hypot(dragNode.x,dragNode.y));
    }
  } else if (panning){
    cam.tx -= dx/cam.z; cam.ty -= dy/cam.z;
    cam.x=cam.tx; cam.y=cam.ty;
  } else {
    const n=nodeAt(e.clientX,e.clientY);
    hoverNode=n;
    canvas.classList.toggle('pointing', !!n);
    if (n){
      tip.style.opacity=1;
      tip.style.left=Math.min(W-300, e.clientX+18)+'px';
      tip.style.top=(e.clientY+18)+'px';
      if (n.kind==='topic'||n.kind==='topicCenter'){
        tip.querySelector('.t-title').textContent=n.ref.name;
        const ppl=topicPeople(n.id).length;
        tip.querySelector('.t-sub').textContent=`${topicEvents[n.id].length} moments · ${ppl} people · ${n.kind==='topic'?'click to enter':'the heart of this story'}`;
      } else {
        tip.querySelector('.t-title').textContent=n.ref.name;
        tip.querySelector('.t-sub').textContent=`${n.ref.role} · click to read their timeline`;
      }
    } else tip.style.opacity=0;
  }
  lastMx=e.clientX; lastMy=e.clientY;
});
canvas.addEventListener('pointerup', e=>{
  canvas.classList.remove('dragging');
  if (!moved){
    const n=nodeAt(e.clientX,e.clientY);
    if (n){
      if (n.kind==='topic') makeTopicNodes(n.id);
      else if (n.kind==='person') openPerson(n.id, currentTopic ? currentTopic.id : null);
      else if (n.kind==='topicCenter') openStory(n.id);
    }
  }
  dragNode=null; panning=false;
});
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  const f = Math.exp(-e.deltaY*0.0012);
  cam.tz = Math.max(0.4, Math.min(2.6, cam.tz*f));
},{passive:false});

/* =====================================================================
   PERSON VIEW — narrative timeline
   ===================================================================== */
const veil=document.getElementById('veil');
function openPerson(pid, tid){
  const p=personById[pid];
  let evs = personEvents[pid];
  const scoped = tid && evs.some(e=>e.topics.includes(tid));
  if (scoped) evs = evs.filter(e=>e.topics.includes(tid));
  const t = tid?topicById[tid]:null;

  let html = `
    <div class="person-head">
      <div class="avatar" style="${avatarStyle(p)}">${initials(p.name)}</div>
      <div>
        <h2>${esc(p.name)}${scoped?` <span style="color:var(--text-faint)">×</span> <span style="color:${t.color}">${esc(t.name)}</span>`:''}</h2>
        <div class="role">${esc(p.role)}</div>
      </div>
    </div>
    <p class="person-bio">${esc(p.bio)}</p>`;
  if (scoped && personEvents[pid].length>evs.length){
    html += `<div style="margin-top:6px"><span class="chip" onclick="openPerson('${pid}',null)">View full timeline — ${personEvents[pid].length} moments across all topics →</span></div>`;
  }
  html += `<div class="tl-context">${scoped?`The story of ${esc(p.name.split(' ')[0])} and ${esc(t.name)}`:'A life in moments'}</div>`;
  html += `<div class="timeline">`;
  let lastYear='';
  for (const e of evs){
    const yr=e.date.slice(0,4);
    if (yr!==lastYear){ html+=`<div class="tl-year">${yr}</div>`; lastYear=yr; }
    html += storyCardHTML(e);
  }
  html += `</div>`;
  document.getElementById('person-body').innerHTML=html;
  document.getElementById('event-panel').classList.remove('open');
  document.getElementById('person-panel').classList.add('open');
  veil.classList.add('on');
}
window.openPerson=openPerson;

function storyCardHTML(e){
  const others = e.people.slice(0,4).map(pid=>{
    const pp=personById[pid];
    return `<span class="chip" onclick="event.stopPropagation();openPerson('${pid}',null)">${esc(pp.name)}</span>`;
  }).join('');
  const tchips = e.topics.map(tid=>{
    const tt=topicById[tid];
    return `<span class="chip topic-chip" onclick="event.stopPropagation();enterTopic('${tid}')"><span class="dot" style="background:${tt.color}"></span>${esc(tt.name)}</span>`;
  }).join('');
  return `<div class="story-card" onclick="openEvent('${e.id}')">
    <div class="sc-date">${fmtDate(e)}</div>
    <h3>${esc(e.title)}</h3>
    <div class="sc-sum">${esc(e.summary.length>180? e.summary.slice(0,178).replace(/\s+\S*$/,'')+'…' : e.summary)}</div>
    <div class="sc-meta">${tchips}${others}</div>
  </div>`;
}
function enterTopic(tid){ closePanels(); exitStory(); makeTopicNodes(tid); }
window.enterTopic=enterTopic;

/* =====================================================================
   EVENT VIEW — the moment and its connections
   ===================================================================== */
function eventNeighbors(e){
  // before/after within shared topics, chronological
  const before=new Map(), after=new Map();
  for (const tid of e.topics){
    const seq=topicEvents[tid];
    const i=seq.indexOf(e);
    if (i>0) before.set(seq[i-1].id, seq[i-1]);
    if (i<seq.length-1) after.set(seq[i+1].id, seq[i+1]);
  }
  // related by shared people (excluding direct neighbours)
  const related = EVENTS.filter(o=>o!==e && !before.has(o.id) && !after.has(o.id) &&
    o.people.some(p=>e.people.includes(p))).slice(0,4);
  return { before:[...before.values()], after:[...after.values()], related };
}

function openEvent(eid){
  const e=eventById[eid];
  const nb=eventNeighbors(e);
  const ppl = e.people.map(pid=>{
    const p=personById[pid];
    return `<div class="person-pill" onclick="openPerson('${pid}',null)">
      <div class="avatar" style="${avatarStyle(p)}">${initials(p.name)}</div>
      <div><span class="pp-name">${esc(p.name)}</span><span class="pp-role">${esc(p.role)}</span></div>
    </div>`;
  }).join('');
  const tchips=e.topics.map(tid=>{
    const tt=topicById[tid];
    return `<span class="chip topic-chip" onclick="enterTopic('${tid}')"><span class="dot" style="background:${tt.color}"></span>${esc(tt.name)}</span>`;
  }).join('');
  const connCol = (list, empty)=> list.length
    ? list.map(o=>`<div class="conn-card" onclick="openEvent('${o.id}')"><div class="cc-date">${fmtDate(o)}</div><div class="cc-title">${esc(o.title)}</div></div>`).join('')
    : `<div class="conn-empty">${empty}</div>`;
  const docs = e.docs && e.docs.length
    ? `<div class="ev-section"><h4>From the archive</h4>${e.docs.map(d=>`<div class="doc-link"><span class="ico">⌘</span>${esc(d)}</div>`).join('')}</div>` : '';
  const related = nb.related.length
    ? `<div class="ev-section"><h4>Threads that cross here</h4>${nb.related.map(o=>`<div class="conn-card" onclick="openEvent('${o.id}')"><div class="cc-date">${fmtDate(o)}</div><div class="cc-title">${esc(o.title)}</div></div>`).join('')}</div>` : '';

  document.getElementById('event-body').innerHTML = `
    <div class="ev-date">${fmtDate(e)}</div>
    <div class="ev-title">${esc(e.title)}</div>
    <div class="ev-summary">${esc(e.summary)}</div>
    <div class="ev-section"><h4>Who was in the room</h4><div class="people-row">${ppl}</div></div>
    <div class="ev-section"><h4>Part of these stories</h4><div class="sc-meta">${tchips}</div></div>
    <div class="ev-section"><h4>The chain of events</h4>
      <div class="conn-grid">
        <div class="conn-col"><h5>What led to this</h5>${connCol(nb.before,'This is where the story begins.')}</div>
        <div class="conn-col"><h5>What came after</h5>${connCol(nb.after,'The story is still being written.')}</div>
      </div>
    </div>
    ${related}${docs}`;
  document.getElementById('event-panel').classList.add('open');
  veil.classList.add('on');
}
window.openEvent=openEvent;

function closePanels(){
  document.getElementById('person-panel').classList.remove('open');
  document.getElementById('event-panel').classList.remove('open');
  veil.classList.remove('on');
}
window.closePanels=closePanels;

/* =====================================================================
   STORY MODE
   ===================================================================== */
let storySlides=[], storyIdx=0;
function actLabel(i, n){
  if (i===0) return 'Prologue';
  if (i===n-1) return 'Epilogue';
  const frac=i/(n-1);
  if (frac<0.34) return 'The Beginning';
  if (frac<0.5) return 'The Pressure Builds';
  if (frac<0.75) return 'The Turning Point';
  return 'A New Course';
}
function openStory(tid){
  closePanels();
  const t=topicById[tid];
  const evs=topicEvents[tid];
  const cast=topicPeople(tid).slice(0,5);
  const span=`${evs[0].date.slice(0,4)} – ${evs[evs.length-1].date.slice(0,4)}`;
  storySlides=[];
  storySlides.push({
    act:'Prologue', date:span, title:t.name,
    body:t.description, people:cast.map(c=>c.person)
  });
  const n=evs.length+2;
  evs.forEach((e,i)=>storySlides.push({
    act: actLabel(i+1, n), date: fmtDate(e), title: e.title,
    body: e.summary, people: e.people.map(p=>personById[p]), eid: e.id
  }));
  storySlides.push({
    act:'Epilogue', date:'…and after', title:'Where the story stands',
    body:`${evs.length} moments. ${topicPeople(tid).length} people. ${t.name} began as one thread of a national emergency and ended as part of a new settlement — proof that crises don't make reforms, people do. Step back to the atlas to follow the threads that cross this story: every person here appears in other stories, and every story bends the others.`,
    people: cast.map(c=>c.person)
  });
  storyIdx=0;
  document.getElementById('story-kicker').textContent=`A Story from the Atlas · ${t.name}`;
  renderStorySlide();
  document.getElementById('story').classList.add('open');
}
window.openStory=openStory;

function renderStorySlide(){
  const s=storySlides[storyIdx];
  const ppl = s.people && s.people.length ? `<div class="ss-people">${s.people.map(p=>`
    <div class="sp" onclick="exitStory();openPerson('${p.id}',null)" style="cursor:pointer">
      <div class="avatar" style="${avatarStyle(p)};margin:0 auto">${initials(p.name)}</div>
      <div class="spn">${esc(p.name)}</div>
    </div>`).join('')}</div>` : '';
  const open = s.eid ? `<div style="margin-top:26px"><span class="chip" onclick="exitStory();openEvent('${s.eid}')">Open this moment →</span></div>`:'';
  document.getElementById('story-stage').innerHTML=`
    <div class="story-slide">
      <div class="ss-act">${s.act}</div>
      <div class="ss-date">${esc(s.date)}</div>
      <div class="ss-title">${esc(s.title)}</div>
      <div class="ss-body">${esc(s.body)}</div>
      ${ppl}${open}
    </div>`;
  const prog=document.getElementById('story-progress');
  prog.innerHTML=storySlides.map((_,i)=>`<div class="pip ${i<storyIdx?'done':''} ${i===storyIdx?'now':''}" onclick="storyGo(${i})"></div>`).join('');
  document.getElementById('snav-prev').disabled = storyIdx===0;
  document.getElementById('snav-next').disabled = storyIdx===storySlides.length-1;
}
function storyStep(d){ storyGo(storyIdx+d); }
function storyGo(i){ if(i<0||i>=storySlides.length)return; storyIdx=i; renderStorySlide(); }
function exitStory(){ document.getElementById('story').classList.remove('open'); }
window.storyStep=storyStep; window.storyGo=storyGo; window.exitStory=exitStory;

addEventListener('keydown', e=>{
  if (document.getElementById('story').classList.contains('open')){
    if (e.key==='ArrowRight'||e.key===' ') storyStep(1);
    if (e.key==='ArrowLeft') storyStep(-1);
    if (e.key==='Escape') exitStory();
    return;
  }
  if (e.key==='Escape'){
    if (document.getElementById('event-panel').classList.contains('open') ||
        document.getElementById('person-panel').classList.contains('open')) closePanels();
    else if (mode==='topic') goAtlas();
  }
});

/* boot */
makeAtlasNodes();
</script>
</body>
</html>
